<?xml version="1.0" encoding="UTF-8"?>
<!--
  标签页图标, 页头那枚小标记也复用它.

  纯几何标记, 不排汉字: 16px 下"薪"是 17 画, 缩到那一格只会糊成一团黑; 而且 SVG 图标不走页面的
  字体栈, 在没装中文字体的机器上会直接落成一个空方框. 一簇三舌火苗, 既是"薪火"的本相, 也避开了
  笔画 —— 不再用三根柱子, 是因为柱状图说的是"数据", 而这次要它先说出"火".

  顶上那三个峰是**必须**的, 不是装饰. 本图标第一版是一个对称的圆底尖顶, 渲染出来读作水滴 ——
  水滴与火苗的差别几乎全在顶上: 水滴是一个尖顶, 火苗是长短几条舌、舌与舌之间还得凹下去. 故这里
  留三个峰 (左 11.2,10.4 / 中 16.0,6.4 / 右 20.6,9.0), 中间那条最高. 把凹口填平, 它立刻变回水滴.

  峰数不是越多越好: 三条在 16px 下已经到顶, 再密就糊成锯齿; 而且**高度必须有层次** —— 试过把右舌
  抬到跟中舌齐平, 两条会并成一条, 又变回"一个尖顶". 中舌独占最高点, 是这张图能读成火的关键.

  这里的 #c2410c 是**写死**的, 且必须与 style.css 的 `color-brand` 令牌同值: 图标由浏览器在页面
  之外渲染, 读不到那份令牌, 换品牌色时这一处要跟着手改. (全仓只有这一处硬编码品牌色 —— 早先
  这里还记着"第二处是 backend 的 /docs 主题", 那个主题已经不存在了.)

  **本文件是 XML, 注释里不能出现连续两个 ASCII 连字符**: 上面那个变量名因此去掉了两条前导杠.
  把前导杠补回去, 整个图标就会解析失败, 表现是页内碎图 + 标签页图标退回上一张.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  role="img"
  aria-label="薪火量化"
>
  <rect
    width="32"
    height="32"
    rx="7"
    fill="#c2410c"
  />
  <path
    d="M20.6 9C22 12.4 22.5 14.6 22.5 16.6C22.5 21 19.9 24.8 16 24.8C12.1 24.8 9.5 21 9.5 16.6C9.5 14.4 9.9 12.4 11.2 10.4C11.9 11.6 12.7 12.4 13.8 12.6C14.6 10.6 15.2 8.4 16 6.4C16.8 8.6 17.4 10.8 18.2 12C19 10.8 20 10.6 20.6 9Z"
    fill="#ffffff"
  />
</svg>
